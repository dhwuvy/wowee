<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCQ Practice</title>
  
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['[', ']']]
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      color: #111;
      background: #fff;
    }

    .topic-bar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topic-bar select {
      padding: 6px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
    }

    .header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .question-box {
      font-size: 18px;
      margin-bottom: 20px;
      padding: 10px 0;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 15px;
      border: 1px solid #ccc;
      background: #f9f9f9;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #eee;
    }

    .option-btn.correct {
      background: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
      font-weight: bold;
    }

    .option-btn.incorrect {
      background: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }

    .feedback {
      margin-top: 20px;
      padding: 12px;
      border-radius: 4px;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct-bg {
      background: #e2f0d9;
      color: #2e5b1e;
    }

    .feedback.incorrect-bg {
      background: #fce4d6;
      color: #843c0c;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
    }

    .btn {
      padding: 10px 20px;
      font-size: 15px;
      border: 1px solid #333;
      background: #333;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #fff;
      color: #333;
    }

    .completed-box {
      text-align: center;
      padding: 40px 0;
    }

    .answer-input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 18px;
      font-family: inherit;
    }

    .answer-input:focus {
      outline: 2px solid #333;
      outline-offset: 2px;
    }

    .answer-input.correct {
      background: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }

    .answer-input.incorrect {
      background: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }

    .input-hint {
      margin: 0;
      font-size: 14px;
      color: #666;
    }
    
  </style>
</head>
<body>

  <div class="topic-bar">
    <label for="topic-select"><strong>Select Topic:</strong></label>
    <select id="topic-select" onchange="switchTopic(this.value)"></select>
  </div>

  <div id="quiz-container">
    <div class="header">
      <span id="progress">Question 1</span>
      <span id="score">Score: 0/0</span>
    </div>

    <div id="question" class="question-box"></div>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback"></div>

    <div class="controls">
      <button id="reset-btn" class="btn btn-secondary" onclick="resetQuiz()">New Problem Set</button>
      <button id="next-btn" class="btn" onclick="nextQuestion()" disabled>Next Question</button>
    </div>
  </div>

  <div id="completed-container" class="completed-box" style="display: none;">
    <h2>Topic Completed!</h2>
    <p id="final-score" style="font-size: 20px;"></p>
    <button class="btn" onclick="resetQuiz()">Generate New Set</button>
  </div>

  <!-- LOAD THE EXTERNAL QUESTION BANK -->
  <script src="questions.js"></script>

  <!-- APP ENGINE LOGIC -->
  <!-- APP ENGINE LOGIC -->
<script>
  const QUESTIONS_PER_BATCH = 10;

  let currentTopic = '';
  let activeQuestions = [];
  let shuffledDefinitions = [];
  let nextDefinitionIndex = 0;
  let questionOffset = 0;
  let currentIndex = 0;
  let score = 0;
  let answeredCount = 0;
  let optionSelected = false;

  function typesetMath() {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise().catch(console.error);
    }
  }

  function populateTopicDropdown() {
    const select = document.getElementById('topic-select');
    select.innerHTML = '';

    const topics = Object.keys(topicDefinitions);
    if (topics.length === 0) return;

    currentTopic = topics[0];

    topics.forEach(topic => {
      const option = document.createElement('option');
      option.value = topic;
      option.textContent = topic;
      select.appendChild(option);
    });
  }

  function switchTopic(newTopic) {
    currentTopic = newTopic;
    resetQuiz();
  }

  function loadQuestionsForTopic() {
    shuffledDefinitions = shuffleArray(
      topicDefinitions[currentTopic] || []
    );

    nextDefinitionIndex = 0;
    loadNextBatch();
  }

  function loadNextBatch() {
    questionOffset = nextDefinitionIndex;

    const batch = shuffledDefinitions.slice(
      nextDefinitionIndex,
      nextDefinitionIndex + QUESTIONS_PER_BATCH
    );

    nextDefinitionIndex += batch.length;

    activeQuestions = batch.map(item =>
      typeof item === 'function' ? item() : item
    );
  }

  function renderQuestion() {
    const q = activeQuestions[currentIndex];
    if (!q) return;

    document.getElementById('progress').textContent =
      `Question ${questionOffset + currentIndex + 1} of ${shuffledDefinitions.length}`;

    document.getElementById('score').textContent =
      `Score: ${score}/${answeredCount}`;

    document.getElementById('question').innerHTML = q.question;

    const feedbackEl = document.getElementById('feedback');
    feedbackEl.className = 'feedback';
    feedbackEl.style.display = 'none';
    feedbackEl.innerHTML = '';

    document.getElementById('next-btn').disabled = true;
    optionSelected = false;

    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    if (q.type === 'text') {
      const form = document.createElement('form');
      form.className = 'options';

      const input = document.createElement('input');
      input.id = 'typed-answer';
      input.className = 'answer-input';
      input.type = 'text';
      input.placeholder = q.placeholder || 'Enter your answer';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.setAttribute('autocapitalize', 'none');
      input.setAttribute('aria-label', 'Your answer');
      input.required = true;

      const hint = document.createElement('p');
      hint.className = 'input-hint';
      hint.textContent = q.hint ||
        'Enter three letters using u, d, and s. Order does not matter.';

      const submitButton = document.createElement('button');
      submitButton.id = 'submit-answer';
      submitButton.className = 'btn';
      submitButton.type = 'submit';
      submitButton.textContent = 'Check Answer';

      form.append(input, hint, submitButton);

      form.addEventListener('submit', event => {
        event.preventDefault();
        submitTypedAnswer();
      });

      optionsContainer.appendChild(form);
      input.focus();
    } else {
      q.options.forEach((optText, index) => {
        const button = document.createElement('button');
        button.className = 'option-btn';
        button.innerHTML =
          `${String.fromCharCode(65 + index)}. ${optText}`;

        button.onclick = () => selectOption(index);
        optionsContainer.appendChild(button);
      });
    }

    typesetMath();
  }

  function checkQuarkAnswer(userAnswer, correctAnswer) {
    const normalize = value =>
      value.toLowerCase().replace(/\s+/g, '');

    const entered = normalize(userAnswer);
    const expected = normalize(correctAnswer);

    if (!/^[uds]{3}$/.test(entered)) return false;

    const sortLetters = value =>
      value.split('').sort().join('');

    return sortLetters(entered) === sortLetters(expected);
  }

  function finishAnswer(isCorrect, explanation) {
    optionSelected = true;
    answeredCount++;

    if (isCorrect) score++;

    document.getElementById('score').textContent =
      `Score: ${score}/${answeredCount}`;

    const feedbackEl = document.getElementById('feedback');

    feedbackEl.style.display = 'block';
    feedbackEl.className = isCorrect
      ? 'feedback show correct-bg'
      : 'feedback show incorrect-bg';

    feedbackEl.innerHTML =
      `<strong>${isCorrect ? 'Correct!' : 'Incorrect.'}</strong> ` +
      (explanation || '');

    const nextButton = document.getElementById('next-btn');
    nextButton.disabled = false;
    nextButton.focus();

    typesetMath();
  }

  function selectOption(selectedIndex) {
    const q = activeQuestions[currentIndex];

    if (!q || optionSelected || q.type === 'text') return;

    const isCorrect = selectedIndex === q.answer;

    const buttons = document.querySelectorAll(
      '#options .option-btn'
    );

    buttons.forEach((button, index) => {
      button.disabled = true;

      if (index === q.answer) {
        button.classList.add('correct');
      } else if (index === selectedIndex) {
        button.classList.add('incorrect');
      }
    });

    finishAnswer(isCorrect, q.explanation);
  }

  function submitTypedAnswer() {
    const q = activeQuestions[currentIndex];

    if (!q || optionSelected || q.type !== 'text') return;

    const input = document.getElementById('typed-answer');

    if (!input.value.trim()) {
      input.focus();
      return;
    }

    const isCorrect = checkQuarkAnswer(
      input.value,
      q.correctAnswer
    );

    input.disabled = true;
    input.classList.add(isCorrect ? 'correct' : 'incorrect');

    document.getElementById('submit-answer').disabled = true;

    finishAnswer(
      isCorrect,
      q.explanation ||
        `The correct composition is $${q.correctAnswer}$.`
    );
  }

  function nextQuestion() {
    if (!optionSelected) return;

    currentIndex++;

    if (currentIndex < activeQuestions.length) {
      renderQuestion();
    } else if (nextDefinitionIndex < shuffledDefinitions.length) {
      loadNextBatch();
      currentIndex = 0;
      renderQuestion();
    } else {
      showCompletionScreen();
    }
  }

  function showCompletionScreen() {
    document.getElementById('quiz-container').style.display =
      'none';

    document.getElementById('completed-container').style.display =
      'block';

    const percentage = answeredCount
      ? Math.round((score / answeredCount) * 100)
      : 0;

    document.getElementById('final-score').textContent =
      `You scored ${score} / ${answeredCount} (${percentage}%) in ${currentTopic}.`;
  }

  function resetQuiz() {
    currentIndex = 0;
    score = 0;
    answeredCount = 0;
    optionSelected = false;

    loadQuestionsForTopic();

    document.getElementById('quiz-container').style.display =
      'block';

    document.getElementById('completed-container').style.display =
      'none';

    if (activeQuestions.length === 0) {
      showCompletionScreen();
      return;
    }

    renderQuestion();
  }

  document.addEventListener('keydown', event => {
    if (event.repeat || event.isComposing) return;

    const quizVisible =
      document.getElementById('quiz-container').style.display !==
      'none';

    if (!quizVisible) return;

    const target = event.target;

    if (
      target instanceof Element &&
      target.closest(
        'input, textarea, select, button, [contenteditable="true"]'
      )
    ) {
      return;
    }

    const q = activeQuestions[currentIndex];
    if (!q) return;

    const key = event.key.toUpperCase();

    if (
      q.type !== 'text' &&
      !optionSelected &&
      ['A', 'B', 'C', 'D'].includes(key)
    ) {
      const optionIndex = key.charCodeAt(0) - 65;
      const buttons = document.querySelectorAll(
        '#options .option-btn'
      );

      if (buttons[optionIndex]) {
        event.preventDefault();
        selectOption(optionIndex);
      }
    } else if (
      optionSelected &&
      (event.key === ' ' || event.key === 'Enter')
    ) {
      event.preventDefault();
      nextQuestion();
    }
  });

  populateTopicDropdown();
  resetQuiz();
</script>
</body>
</html>
